[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vacation-ghost"
version = "0.1.0"
description = "A local occupancy routine for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
vacation-ghost = "vacation_ghost.__main__:main"

[tool.setuptools.packages.find]
include = ["vacation_ghost"]
