name: Validate website

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install browser test runner
        run: python -m pip install playwright==1.62.0
      - name: Install WebKit and its system dependencies
        run: python -m playwright install --with-deps webkit
      - name: Install Chromium when the runner has no browser
        run: |
          if ! command -v chromium >/dev/null && ! command -v google-chrome >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Check documentation, links and examples
        run: python tools/check_docs.py
      - name: Check website and simulator in Chromium and WebKit
        run: python tools/check_site.py --browser --webkit
