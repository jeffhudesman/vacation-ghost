name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Simulate a complete trip
        run: |
          state_dir="$(mktemp -d)"
          python -m vacation_ghost --config examples/vacation.example.toml simulate --state-dir "$state_dir"
          python - "$state_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          state = Path(sys.argv[1])
          assert len(list((state / "daily").glob("*.json"))) == 3
          assert json.loads((state / "trip.json").read_text())["dry_run"]
          assert not json.loads((state / "latest.json").read_text())["active"]
          PY

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install build==1.3.0
      - name: Build from a clean Git archive and verify package contents
        run: |
          set -eu
          release_dir="$(mktemp -d "${RUNNER_TEMP}/vacation-ghost-package.XXXXXX")"
          source_dir="$release_dir/source"
          mkdir "$source_dir"
          git --no-replace-objects archive --format=tar HEAD > "$release_dir/source.tar"
          tar -xf "$release_dir/source.tar" -C "$source_dir"
          python -m build --outdir "$release_dir/dist" "$source_dir"

          printf '%s\n' '# Synthetic private config for the archive check.' \
            > "$source_dir/examples/household.local.toml"
          python -m build --sdist --outdir "$release_dir/privacy-check" "$source_dir"

          python - "$release_dir" <<'PY'
          import sys
          import tarfile
          from pathlib import Path

          release = Path(sys.argv[1])
          examples = {"examples/vacation.example.toml", "examples/vacation.lights-only.toml"}
          required = examples | {
              "LICENSE", "README.md", "CONTRIBUTING.md",
              "docs/hardware.md", "docs/service.md",
              "deploy/vacation-ghost.service", "deploy/lights-only.conf",
              "deploy/rpi-ws281x-source.txt", "tools/generate_sounds.py",
          }
          for output_dir in ("dist", "privacy-check"):
              source_archive, = (release / output_dir).glob("*.tar.gz")
              with tarfile.open(source_archive, "r:gz") as archive:
                  paths = {
                      member.name.partition("/")[2]
                      for member in archive.getmembers()
                      if member.isfile()
                  }
                  assert required <= paths, sorted(required - paths)
                  config_paths = {path for path in paths if path.startswith("examples/") and path.endswith(".toml")}
                  assert config_paths == examples, sorted(config_paths ^ examples)

          archive_path, = (release / "dist").glob("*.tar.gz")
          with tarfile.open(archive_path, "r:gz") as archive:
              example_name = f"{archive_path.name.removesuffix('.tar.gz')}/examples/vacation.example.toml"
              with archive.extractfile(example_name) as sample:
                  (release / "vacation.example.toml").write_bytes(sample.read())
          PY
          python -m venv "$release_dir/venv"
          "$release_dir/venv/bin/python" -m pip install --no-index --no-deps "$release_dir"/dist/*.whl
          cd "$release_dir"
          venv/bin/vacation-ghost --config vacation.example.toml simulate --state-dir state
          venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          state = Path("state")
          assert len(list((state / "daily").glob("*.json"))) == 3
          assert json.loads((state / "trip.json").read_text())["dry_run"]
          assert not json.loads((state / "latest.json").read_text())["active"]
          PY
