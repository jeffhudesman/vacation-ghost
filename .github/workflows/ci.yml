name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Simulate a complete trip
        run: |
          state_dir="$(mktemp -d)"
          python -m vacation_ghost --config examples/vacation.example.toml simulate --state-dir "$state_dir"
          python - "$state_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          state = Path(sys.argv[1])
          assert len(list((state / "daily").glob("*.json"))) == 3
          assert json.loads((state / "trip.json").read_text())["dry_run"]
          assert not json.loads((state / "latest.json").read_text())["active"]
          PY

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install build==1.3.0
      - name: Build and test the installed distribution
        run: |
          release_dir="$(mktemp -d "${RUNNER_TEMP}/vacation-ghost-package.XXXXXX")"
          python -m build --outdir "$release_dir/dist"
          python - "$release_dir" <<'PY'
          import sys
          import tarfile
          from pathlib import Path

          release = Path(sys.argv[1])
          archive_path, = (release / "dist").glob("*.tar.gz")
          with tarfile.open(archive_path, "r:gz") as archive:
              files = {
                  member.name.partition("/")[2]: member
                  for member in archive.getmembers()
                  if member.isfile()
              }
              required = {
                  "LICENSE", "README.md", "CONTRIBUTING.md",
                  "docs/hardware.md", "docs/service.md",
                  "deploy/vacation-ghost.service", "deploy/lights-only.conf",
                  "deploy/rpi-ws281x-source.txt", "tools/generate_sounds.py",
                  "examples/vacation.example.toml", "examples/vacation.lights-only.toml",
              }
              assert required <= files.keys(), sorted(required - files.keys())
              with archive.extractfile(files["examples/vacation.example.toml"]) as sample:
                  (release / "vacation.example.toml").write_bytes(sample.read())
          PY
          python -m venv "$release_dir/venv"
          "$release_dir/venv/bin/python" -m pip install --no-index --no-deps "$release_dir"/dist/*.whl
          cd "$release_dir"
          venv/bin/vacation-ghost --config vacation.example.toml simulate --state-dir state
          venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          state = Path("state")
          assert len(list((state / "daily").glob("*.json"))) == 3
          assert json.loads((state / "trip.json").read_text())["dry_run"]
          assert not json.loads((state / "latest.json").read_text())["active"]
          PY
