name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Simulate a complete trip
        run: |
          state_dir="$(mktemp -d)"
          python -m vacation_ghost --config examples/vacation.example.toml simulate --state-dir "$state_dir"
          python - "$state_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          state = Path(sys.argv[1])
          assert len(list((state / "daily").glob("*.json"))) == 3
          assert json.loads((state / "trip.json").read_text())["dry_run"]
          assert not json.loads((state / "latest.json").read_text())["active"]
          PY
