name: Publish developer preview

on:
  push:
    tags: ['v*-preview.*']

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify the preview tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-preview\.([0-9]+)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - "${BASH_REMATCH[1]}a${BASH_REMATCH[2]}" <<'PY'
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as metadata:
              assert tomllib.load(metadata)["project"]["version"] == sys.argv[1]
          PY
      - run: python -m unittest discover -s tests -v

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create the prerelease
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --title "Vacation Ghost $GITHUB_REF_NAME" --notes-file - <<EOF
          Vacation Ghost is an open-source Raspberry Pi project that makes an empty house look lived in. The Linux simulator is ready to try. See the [hardware guide]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/hardware.md) for current physical test results.

          Use this full commit ID when following the [lights-only Pi setup guide]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/service.md#install-from-a-verified-release).

          \`$GITHUB_SHA\`

          Before relying on the Pi, complete the [physical checklist]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/hardware.md#physical-release-checklist) with your exact setup.
          EOF
